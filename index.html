<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一問一答ポータル</title>
  <style>
    :root {
      --primary: #4a6fa5;
      --success: #28a745;
      --danger: #dc3545;
      --bg: #0d0614;
      --card-bg: rgba(255, 255, 255, 0.92);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: #333;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: flex-end; /* 🎯 画面下寄りに配置 */
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* 🎯 問題カードなどのアプリ枠：下側に配置 */
    .app-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(8px);
      margin-bottom: 20px; /* 下部に少し余白を確保 */
      margin-top: 160px;   /* 🎯 上部に余白を作り、ボスの顔を見せるスペースを確保 */
    }

    h1, h2 {
      text-align: center;
      margin-top: 0;
      color: var(--primary);
    }

    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.2rem; }

    button, input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:active { opacity: 0.9; }
    button:disabled {
      background-color: #cccccc !important;
      cursor: not-allowed;
    }

    /* 教科選択グリッド */
    .subject-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .subject-btn {
      padding: 20px 10px;
      font-size: 1.1rem;
      background-color: #eef2f7;
      color: #333;
      border: 2px solid var(--primary);
      margin-bottom: 0;
    }

    /* 分野・カテゴリチェックボックス */
    .category-group {
      background: #f1f3f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      max-height: 200px;
      overflow-y: auto;
    }

    .category-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    .category-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      cursor: pointer;
    }

    .select-tools {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .select-tools button {
      padding: 6px 12px;
      font-size: 0.85rem;
      background-color: #6c757d;
      margin-bottom: 0;
    }

    .stats {
      background: rgba(238, 242, 247, 0.9);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    /* -----------------------------------
       🌌 全画面バトルステージ演出
    ----------------------------------- */
    body.full-shake {
      animation: screen-shake 0.35s ease-in-out;
    }

    @keyframes screen-shake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-12px, 8px) rotate(-1deg); }
      40% { transform: translate(12px, -8px) rotate(1deg); }
      60% { transform: translate(-8px, -4px); }
      80% { transform: translate(8px, 4px); }
      100% { transform: translate(0, 0); }
    }

    /* 全画面背景ボス画像 */
    .bg-enemy-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-enemy-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* 🎯 顔部分（画像最上部）を画面上部にくっきり合わせる位置指定 */
      object-position: center 5%;
      opacity: 0.65;
      filter: brightness(0.9) contrast(1.25);
      transition: transform 0.1s, filter 0.3s, opacity 0.8s;
    }

    /* ボスダメージ演出 */
    .bg-enemy-img.shake {
      animation: boss-hit 0.4s ease-in-out;
    }

    @keyframes boss-hit {
      0% { transform: scale(1); filter: brightness(0.9); }
      20% { transform: scale(1.05) translate(-10px, 0); filter: brightness(2) drop-shadow(0 0 40px #00ffff); }
      40% { transform: scale(1.05) translate(10px, 0); filter: brightness(2) drop-shadow(0 0 40px #ff0055); }
      60% { transform: scale(1.02); filter: brightness(1.3); }
      100% { transform: scale(1); filter: brightness(0.9); }
    }

    /* 撃破時消滅 */
    .bg-enemy-img.defeated {
      animation: boss-defeated 1.2s forwards;
    }

    @keyframes boss-defeated {
      0% { transform: scale(1); filter: brightness(3) drop-shadow(0 0 50px white); opacity: 0.8; }
      50% { transform: scale(1.1); filter: brightness(5) drop-shadow(0 0 80px red); opacity: 0.5; }
      100% { transform: scale(0.8); filter: brightness(10); opacity: 0; }
    }

    /* 全画面固定 UI（HPゲージ＆コンボ） */
    .fixed-battle-ui {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .hp-container {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #a855f7;
      border-radius: 10px;
      height: 20px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
    }

    .hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(to right, #28a745, #85e085);
      transition: width 0.4s ease-out;
    }

    .combo-badge {
      margin-top: 6px;
      background: linear-gradient(45deg, #ff0055, #ffaa00);
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      padding: 4px 14px;
      border-radius: 15px;
      box-shadow: 0 0 15px #ff0055;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s;
    }

    .combo-badge.show {
      opacity: 1;
      transform: scale(1);
    }

    /* 💥 全画面エフェクト層 */
    .full-fx-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
    }

    /* 衝撃波 */
    .impact-effect {
      position: absolute;
      top: 30%; /* 🎯 衝撃波・スラッシュもボスの顔周辺に合わせる */
      left: 50%;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #ffffff 10%, #00ffff 40%, rgba(255,0,255,0) 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    .impact-effect.active {
      animation: impact-ring 0.45s ease-out;
    }

    @keyframes impact-ring {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(100); opacity: 0; }
    }

    /* ⚔️ 全画面特大スラッシュ */
    .slash-effect {
      position: absolute;
      top: 30%;
      left: 50%;
      width: 0;
      height: 12px;
      background: #ffffff;
      box-shadow: 0 0 30px #00e5ff, 0 0 60px #00e5ff, 0 0 90px #ffffff;
      transform: translate(-50%, -50%) rotate(-35deg);
      opacity: 0;
      border-radius: 6px;
    }

    .slash-effect.active {
      animation: slash-anim 0.35s cubic-bezier(0.1, 0.8, 0.3, 1);
    }

    @keyframes slash-anim {
      0% { width: 0; opacity: 1; transform: translate(-50%, -50%) rotate(-35deg) scaleY(1); }
      50% { width: 200vw; opacity: 1; transform: translate(-50%, -50%) rotate(-35deg) scaleY(3); }
      100% { width: 220vw; opacity: 0; transform: translate(-50%, -50%) rotate(-35deg) scaleY(0.1); }
    }

    /* 🔥 2連撃全画面クロス */
    .combo-slash-effect {
      position: absolute;
      top: 30%;
      left: 50%;
      width: 0;
      height: 16px;
      background: #ffffff;
      box-shadow: 0 0 35px #ff0055, 0 0 70px #ffea00, 0 0 100px #ffffff;
      transform: translate(-50%, -50%) rotate(40deg);
      opacity: 0;
      border-radius: 8px;
    }

    .combo-slash-effect.active {
      animation: combo-slash-anim 0.4s cubic-bezier(0.1, 0.8, 0.3, 1) 0.08s;
    }

    @keyframes combo-slash-anim {
      0% { width: 0; opacity: 1; transform: translate(-50%, -50%) rotate(40deg) scaleY(1); }
      50% { width: 200vw; opacity: 1; transform: translate(-50%, -50%) rotate(40deg) scaleY(4); }
      100% { width: 220vw; opacity: 0; transform: translate(-50%, -50%) rotate(40deg) scaleY(0.1); }
    }

    /* 👑 ダメージ数値 */
    .damage-num {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffea00;
      text-shadow: 0 0 15px #ffea00, 4px 4px 0 #000, -2px -2px 0 #000;
      opacity: 0;
      font-style: italic;
      white-space: nowrap;
    }

    .damage-num.critical {
      color: #00ffff;
      font-size: 4rem;
      text-shadow: 0 0 25px #00ffff, 4px 4px 0 #000;
    }

    .damage-num.combo {
      color: #ff0055;
      font-size: 4.8rem;
      text-shadow: 0 0 30px #ff0055, 0 0 45px #ffea00, 5px 5px 0 #000;
    }

    .damage-num.active {
      animation: pop-damage 0.85s ease-out;
    }

    @keyframes pop-damage {
      0% { transform: translate(-50%, 40px) scale(0.2) rotate(-10deg); opacity: 1; }
      40% { transform: translate(-50%, -20px) scale(1.3) rotate(5deg); opacity: 1; }
      100% { transform: translate(-50%, -60px) scale(1) rotate(0deg); opacity: 0; }
    }

    /* ----------------------------------- */

    .question-card {
      background: #f1f3f5;
      padding: 15px;
      border-radius: 8px;
      min-height: 60px;
      font-size: 1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }

    .feedback {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      display: none;
      position: relative;
      overflow: hidden;
    }

    .feedback.correct {
      background-color: #d4edda;
      color: var(--success);
      display: block;
    }

    .feedback.incorrect {
      background-color: #f8d7da;
      color: var(--danger);
      display: block;
    }

    .timer-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.15);
    }

    .timer-progress {
      height: 100%;
      width: 100%;
      background-color: currentColor;
      animation: countdown 1.5s linear forwards;
    }

    @keyframes countdown {
      from { width: 100%; }
      to { width: 0%; }
    }

    .skip-btn {
      margin-top: 8px;
      padding: 6px 16px;
      font-size: 0.85rem;
      background-color: var(--success);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- 👹 全画面背景ボス画像 -->
<div id="bg-enemy-container" class="bg-enemy-container hidden">
  <img id="bg-enemy-img" class="bg-enemy-img" src="boss.jpg" alt="ボス">
</div>

<!-- 💥 全画面攻撃エフェクト層 -->
<div id="full-fx-layer" class="full-fx-layer hidden">
  <div id="impact" class="impact-effect"></div>
  <div id="slash" class="slash-effect"></div>
  <div id="combo-slash" class="combo-slash-effect"></div>
  <div id="damage" class="damage-num">9999!</div>
</div>

<!-- 🩸 画面上部固定 HP＆コンボUI -->
<div id="fixed-battle-ui" class="fixed-battle-ui hidden">
  <div class="hp-container">
    <div id="hp-bar" class="hp-bar"></div>
  </div>
  <div id="combo-badge" class="combo-badge">0 COMBO!</div>
</div>

<div class="app-container">
  <!-- 1. ホーム画面（教科選択） -->
  <div id="home-screen">
    <h1>一問一答 学習アプリ</h1>
    <p style="text-align: center; color: #666;">学習したい教科を選んでください</p>
    
    <div class="subject-grid">
      <button class="subject-btn" onclick="selectSubject('history', '歴史', '時代')">📜 歴史</button>
      <button class="subject-btn" onclick="selectSubject('math', '数学', '分野')">📐 数学</button>
      <button class="subject-btn" onclick="selectSubject('science', '理科', '分野')">🧪 理科</button>
      <button class="subject-btn" onclick="selectSubject('geography', '地理', '地方・分野')">🌍 地理</button>
      <button class="subject-btn" onclick="selectSubject('english', '英語', 'ジャンル')" style="grid-column: span 2;">🔤 英単語・文法</button>
    </div>
  </div>

  <!-- 2. 分野設定画面 -->
  <div id="setup-screen" class="hidden">
    <h2 id="subject-title">教科名</h2>
    <label><b id="category-label">出題分野を選択（複数可）:</b></label>
    
    <div class="select-tools">
      <button type="button" id="select-all-btn">すべて選択</button>
      <button type="button" id="deselect-all-btn">すべて解除</button>
    </div>

    <div class="category-group" id="category-checkboxes">
      <!-- JavaScriptで動的生成 -->
    </div>
    
    <button id="start-btn">学習を開始する</button>
    <button id="review-btn" style="background-color: #6c757d;">復習する (0件)</button>
    <button onclick="goHome()" style="background-color: #888; margin-top: 5px;">ホームに戻る</button>
  </div>

  <!-- 3. クイズ画面 -->
  <div id="quiz-screen" class="hidden">
    <div class="stats">
      <div>モード: <span id="current-mode"></span></div>
      <div>正答率: <span id="accuracy">0%</span></div>
      <div>解いた数: <span id="progress">0/0</span></div>
    </div>

    <div class="question-card" id="question-text">
      問題を読み込み中...
    </div>

    <form id="answer-form">
      <input type="text" id="answer-input" placeholder="回答を入力" autocomplete="off" required>
      <button type="submit" id="submit-btn">回答する</button>
    </form>

    <div id="feedback" class="feedback"></div>
    <button id="next-btn" class="hidden" style="margin-top: 10px; background-color: var(--success);">次の問題へ</button>
    <button id="back-setup-btn" style="background-color: #6c757d; margin-top: 10px;">分野選択に戻る</button>
  </div>
</div>

<script>
  let currentSubjectKey = '';
  let currentSubjectName = '';
  let allQuestions = [];
  let currentSessionQuestions = [];
  let currentQuestionIndex = 0;
  let correctCount = 0;
  let wrongQuestions = [];
  let autoNextTimer = null;

  // 🎮 ゲーム用変数
  let questionStartTime = 0;
  let sessionStartTime = 0;
  let enemyHp = 100;
  let baseDamagePerQuestion = 0;
  let comboCount = 0;
  let maxComboCount = 0;

  function selectSubject(key, name, labelText) {
    currentSubjectKey = key;
    currentSubjectName = name;
    
    document.getElementById('subject-title').textContent = `${name} 一問一答`;
    document.getElementById('category-label').textContent = `出題する${labelText}を選択（複数可）:`;

    wrongQuestions = JSON.parse(localStorage.getItem(`wrongQuestions_${key}`) || '[]');

    fetch(`${key}.json`)
      .then(response => {
        if (!response.ok) throw new Error();
        return response.json();
      })
      .then(data => {
        allQuestions = data;
        initSetupScreen();
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
      })
      .catch(err => alert(`${name}のデータ (${key}.json) の読み込みに失敗しました。`));
  }

  function initSetupScreen() {
    const categories = [...new Set(allQuestions.map(q => q.category))];
    const container = document.getElementById('category-checkboxes');
    container.innerHTML = '';

    categories.forEach(cat => {
      const label = document.createElement('label');
      label.className = 'category-item';
      
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = cat;
      checkbox.checked = true;
      checkbox.addEventListener('change', updateReviewBtn);

      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(cat));
      container.appendChild(label);
    });

    updateReviewBtn();
  }

  function getSelectedCategories() {
    const checkboxes = document.querySelectorAll('#category-checkboxes input[type="checkbox"]:checked');
    return Array.from(checkboxes).map(cb => cb.value);
  }

  document.getElementById('select-all-btn').addEventListener('click', () => {
    document.querySelectorAll('#category-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = true);
    updateReviewBtn();
  });

  document.getElementById('deselect-all-btn').addEventListener('click', () => {
    document.querySelectorAll('#category-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
    updateReviewBtn();
  });

  function updateReviewBtn() {
    const selectedCats = getSelectedCategories();
    const filteredWrong = wrongQuestions.filter(q => selectedCats.includes(q.category));
    
    const btn = document.getElementById('review-btn');
    btn.textContent = `選択カテゴリから復習 (${filteredWrong.length}件)`;
    btn.disabled = filteredWrong.length === 0;

    document.getElementById('start-btn').disabled = selectedCats.length === 0;
  }

  document.getElementById('start-btn').addEventListener('click', () => startQuiz(false));
  document.getElementById('review-btn').addEventListener('click', () => startQuiz(true));

  function startQuiz(isReviewMode) {
    const selectedCats = getSelectedCategories();

    if (isReviewMode) {
      currentSessionQuestions = wrongQuestions.filter(q => selectedCats.includes(q.category));
      document.getElementById('current-mode').textContent = "復習";
    } else {
      currentSessionQuestions = allQuestions.filter(q => selectedCats.includes(q.category));
      document.getElementById('current-mode').textContent = "ランダム出題";
    }

    currentSessionQuestions.sort(() => Math.random() - 0.5);

    currentQuestionIndex = 0;
    correctCount = 0;
    comboCount = 0;
    maxComboCount = 0;
    enemyHp = 100;

    sessionStartTime = Date.now();

    const totalQ = currentSessionQuestions.length;
    baseDamagePerQuestion = totalQ > 0 ? (100 / totalQ) : 100;

    updateHpBar();
    updateComboBadge();

    // 全画面敵・エフェクト・UIを表示
    document.getElementById('bg-enemy-container').classList.remove('hidden');
    document.getElementById('full-fx-layer').classList.remove('hidden');
    document.getElementById('fixed-battle-ui').classList.remove('hidden');

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    showQuestion();
  }

  function showQuestion() {
    clearTimeout(autoNextTimer);

    const bgEnemyImg = document.getElementById('bg-enemy-img');
    bgEnemyImg.className = 'bg-enemy-img'; 

    const q = currentSessionQuestions[currentQuestionIndex];
    document.getElementById('question-text').textContent = `【${q.category}】 ${q.question}`;
    document.getElementById('answer-input').value = '';
    document.getElementById('answer-input').disabled = false;
    document.getElementById('submit-btn').classList.remove('hidden');
    document.getElementById('next-btn').classList.add('hidden');
    
    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback';
    feedback.innerHTML = '';

    updateStats();
    questionStartTime = Date.now();
  }

  function updateStats() {
    const total = currentQuestionIndex;
    const accuracy = total === 0 ? 0 : Math.round((correctCount / total) * 100);
    document.getElementById('accuracy').textContent = `${accuracy}%`;
    document.getElementById('progress').textContent = `${currentQuestionIndex + 1}/${currentSessionQuestions.length}`;
  }

  function updateHpBar() {
    const hpBar = document.getElementById('hp-bar');
    hpBar.style.width = `${Math.max(0, enemyHp)}%`;

    if (enemyHp <= 30) {
      hpBar.style.background = 'linear-gradient(to right, #dc3545, #ff6b6b)';
    } else {
      hpBar.style.background = 'linear-gradient(to right, #28a745, #85e085)';
    }
  }

  function updateComboBadge() {
    const badge = document.getElementById('combo-badge');
    if (comboCount >= 2) {
      badge.textContent = `${comboCount} COMBO!🔥`;
      badge.classList.add('show');
    } else {
      badge.classList.remove('show');
    }
  }

  // 🎮 全画面超ド派手攻撃エフェクト
  function triggerAttackEffect(timeSec) {
    const bgEnemyImg = document.getElementById('bg-enemy-img');
    const impact = document.getElementById('impact');
    const slash = document.getElementById('slash');
    const comboSlash = document.getElementById('combo-slash');
    const damage = document.getElementById('damage');

    let multiplier = 1.0;
    let label = '';
    let isComboAttack = false;

    if (timeSec <= 5.0) {
      comboCount++;
      if (comboCount > maxComboCount) {
        maxComboCount = comboCount;
      }
      
      if (comboCount >= 3) {
        multiplier = 1.5;
        label = `🔥 ${comboCount} COMBO! `;
        damage.className = 'damage-num combo';
        isComboAttack = true;
      } else if (timeSec <= 3.0) {
        multiplier = 1.2;
        label = '⚡ CRITICAL! ';
        damage.className = 'damage-num critical';
      } else {
        multiplier = 1.0;
        label = 'GREAT! ';
        damage.className = 'damage-num';
      }
    } else {
      comboCount = 0;
      multiplier = 0.6;
      label = 'GOOD ';
      damage.className = 'damage-num';
    }

    updateComboBadge();

    const damagePercent = baseDamagePerQuestion * multiplier;
    enemyHp -= damagePercent;
    if (enemyHp < 0) enemyHp = 0;

    updateHpBar();

    const displayDamage = Math.round(damagePercent * 100);
    damage.textContent = `${label}${displayDamage}`;

    // リセット処理
    document.body.classList.remove('full-shake');
    bgEnemyImg.classList.remove('shake', 'defeated');
    impact.classList.remove('active');
    slash.classList.remove('active');
    comboSlash.classList.remove('active');
    damage.classList.remove('active');

    setTimeout(() => {
      document.body.classList.add('full-shake');
      impact.classList.add('active');
      slash.classList.add('active');

      if (isComboAttack) {
        comboSlash.classList.add('active');
      }

      damage.classList.add('active');

      if (enemyHp <= 0) {
        bgEnemyImg.classList.add('defeated');
      } else {
        bgEnemyImg.classList.add('shake');
      }
    }, 10);
  }

  // 解答判定
  document.getElementById('answer-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('answer-input').value.trim();
    const q = currentSessionQuestions[currentQuestionIndex];
    const feedback = document.getElementById('feedback');

    const answerTimeSec = (Date.now() - questionStartTime) / 1000;

    document.getElementById('answer-input').disabled = true;
    document.getElementById('submit-btn').classList.add('hidden');

    const cleanInput = input.toLowerCase().replaceAll(' ', '');
    const cleanAnswer = q.answer.toLowerCase().replaceAll(' ', '');

    if (cleanInput === cleanAnswer) {
      triggerAttackEffect(answerTimeSec);

      correctCount++;
      feedback.className = "feedback correct";
      feedback.innerHTML = `
        正解！⭕ (${answerTimeSec.toFixed(1)}秒)
        <br>
        <button class="skip-btn" onclick="skipTimer()">次へ進む ⏩</button>
        <div class="timer-bar"><div class="timer-progress"></div></div>
      `;
      wrongQuestions = wrongQuestions.filter(item => item.id !== q.id);

      if (enemyHp <= 0) {
        autoNextTimer = setTimeout(() => {
          finishQuiz();
        }, 1500);
      } else {
        autoNextTimer = setTimeout(() => {
          nextQuestion();
        }, 1500);
      }

    } else {
      comboCount = 0;
      updateComboBadge();

      feedback.className = "feedback incorrect";
      feedback.textContent = `不正解…❌ (正解: ${q.answer})`;
      if (!wrongQuestions.some(item => item.id === q.id)) {
        wrongQuestions.push(q);
      }

      document.getElementById('next-btn').classList.remove('hidden');
    }

    localStorage.setItem(`wrongQuestions_${currentSubjectKey}`, JSON.stringify(wrongQuestions));
    updateReviewBtn();
  });

  function skipTimer() {
    clearTimeout(autoNextTimer);
    if (enemyHp <= 0) {
      finishQuiz();
    } else {
      nextQuestion();
    }
  }

  function nextQuestion() {
    if (currentQuestionIndex + 1 < currentSessionQuestions.length) {
      currentQuestionIndex++;
      showQuestion();
    } else {
      finishQuiz();
    }
  }

  function formatElapsedTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    if (mins > 0) {
      return `${mins}分${secs}秒`;
    }
    return `${secs}秒`;
  }

  function finishQuiz() {
    const totalQ = currentQuestionIndex + 1;
    const accuracyRate = Math.round((correctCount / totalQ) * 100);
    const isDefeated = enemyHp <= 0;

    const elapsedSeconds = Math.round((Date.now() - sessionStartTime) / 1000);
    const timeFormatted = formatElapsedTime(elapsedSeconds);
    
    const titleMsg = isDefeated ? "🎉 敵を撃破しました！お見事！" : "💪 撃破ならず…！次回リベンジしよう！";

    const summaryText = 
      `${titleMsg}\n\n` +
      `-------------------------\n` +
      `【学習リザルト】\n` +
      `・クリア時間: ${timeFormatted}\n` +
      `・正答数: ${correctCount} / ${totalQ} 問 (挑戦問題数)\n` +
      `・正答率: ${accuracyRate}%\n` +
      `・最大コンボ: ${maxComboCount} COMBO🔥\n` +
      `-------------------------`;

    alert(summaryText);
    goSetup();
  }

  document.getElementById('next-btn').addEventListener('click', nextQuestion);

  document.getElementById('back-setup-btn').addEventListener('click', () => {
    clearTimeout(autoNextTimer);
    goSetup();
  });

  function hideBattleLayers() {
    document.getElementById('bg-enemy-container').classList.add('hidden');
    document.getElementById('full-fx-layer').classList.add('hidden');
    document.getElementById('fixed-battle-ui').classList.add('hidden');
  }

  function goSetup() {
    clearTimeout(autoNextTimer);
    hideBattleLayers();
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
    updateReviewBtn();
  }

  function goHome() {
    clearTimeout(autoNextTimer);
    hideBattleLayers();
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('home-screen').classList.remove('hidden');
  }
</script>
</body>
</html>
